# Configuration HTTP initiale (à utiliser avant l'obtention du certificat SSL)
# Une fois le certificat obtenu, décommenter la section HTTPS ci-dessous

server {
    listen 80;
    server_name _;  # Remplacer par votre domaine (ex: immodash.com www.immodash.com)

    # Pour Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection HTTPS (à activer après obtention du certificat)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Configuration temporaire avant HTTPS
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
    }
}

